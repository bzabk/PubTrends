[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pubtrends"
version = "0.1.0"
dependencies = [
    "numpy~=2.2.6",
    "streamlit~=1.47.1",
    "pandas~=2.3.1",
    "plotly~=6.2.0",
    "matplotlib~=3.10.3",
    "redis~=6.2.0",
    "aiohttp~=3.12.15",
    "python-dotenv~=1.1.1",
    "xmltodict~=0.14.2",
    "nltk~=3.9.1",
    "scikit-learn~=1.7.1",
]

[project.optional-dependencies]
test = [
    "pytest~=8.4.1",
    "pytest-asyncio~=0.24.0",
    "pytest-custom_exit_code",
    "ruff"
]

[tool.ruff]
line-length = 88
target-version = "py310"

include = [
    "src/**/*.py",
    "tests/**/*.py"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
]
ignore = [
    "E501"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit",
    "redis",
]
